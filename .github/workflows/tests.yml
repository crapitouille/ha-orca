name: Tests

on: [push, pull_request]

permissions: {}

jobs:
  pytest:
    name: Regression tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"   # oldest supported Home Assistant (2026.2)
          - python: "3.14"   # latest Home Assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements_test.txt
      - run: python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - run: pytest --cov=custom_components/orca --cov-report=term-missing
