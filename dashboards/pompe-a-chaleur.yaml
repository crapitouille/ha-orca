# Tableau de bord « Pompe à chaleur » pour l'intégration Orca (crapitouille/ha-orca).
#
# Quatre vues :
#   * « Accueil » pour l'utilisateur final (état, chauffage, eau chaude, absence, historique) ;
#   * « Technique » (fonctionnement, anti-légionelle, compteurs) ;
#   * « Réglages » (courbe de chauffe, puissances, appoint électrique, eau chaude) ;
#   * « Programmes horaires » (programmes 1 à 5, trois plages et sept jours chacun).
# Tous les réglages exposés par l'intégration y sont modifiables.
# Il n'utilise que des cartes intégrées à Home Assistant.
#
# Installation :
#   1. Paramètres > Tableaux de bord > Ajouter un tableau de bord, en partant d'un tableau de bord vide.
#   2. Ouvrir ce tableau de bord, puis le crayon > menu ⋮ > Éditeur de configuration brute.
#   3. Remplacer tout le contenu par ce fichier et enregistrer.
#
# Les identifiants d'entités (sensor.orca_heat_pump_...) sont ceux créés par
# Home Assistant 2026.11 pour un appareil nommé « Orca Heat Pump », avec les noms
# d'entités en anglais et un circuit nommé « Floor ». S'ils diffèrent chez vous,
# adaptez-les : une tuile dont l'entité n'existe pas affiche « Entité introuvable ».
# Les entités que votre PAC ne fournit pas peuvent simplement être retirées.

views:
- title: Accueil
  path: accueil
  icon: mdi:home-thermometer
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: État
      icon: mdi:heat-pump
    - type: markdown
      content: |-
        ## ⚠️ La pompe à chaleur signale une alarme
        Type d'alarme : {{ states("sensor.orca_heat_pump_alarm_type") }} · Code d'erreur : {{ states("sensor.orca_heat_pump_error_code") }}

        Consultez l'écran de la pompe à chaleur ou contactez l'installateur.
      visibility:
      - condition: state
        entity: binary_sensor.orca_heat_pump_alarm_active
        state: 'on'
      grid_options:
        columns: full
    - type: markdown
      content: |-
        {% set s = states("sensor.orca_heat_pump_current_state") %}{% set v = states("sensor.orca_heat_pump_position_of_3_way_valve") %}{% set etats = {"idle": "au repos", "heating": "en chauffe", "cooling": "en rafraîchissement", "defrost": "en dégivrage"} %}## La pompe à chaleur est {{ etats.get(s, s) }}
        {% if s == "heating" %}{{ "Elle produit l'eau chaude sanitaire." if v == "hot_water" else "Elle chauffe le plancher." }}{% elif s == "idle" %}Aucune demande en cours.{% endif %}
      grid_options:
        columns: full
    - type: tile
      entity: sensor.orca_heat_pump_outside_temperature
      name: Température extérieure
      icon: mdi:thermometer
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.orca_heat_pump_outdoor_unit_power
      name: Puissance
      icon: mdi:speedometer
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.orca_heat_pump_alarm_active
      name: Alarme
      icon: mdi:alert-circle
      color: red
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.orca_heat_pump_electric_heater
      name: Appoint électrique
      icon: mdi:heating-coil
      color: orange
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Chauffage
      icon: mdi:heating-coil
    - type: tile
      entity: climate.orca_heat_pump_floor
      name: Plancher chauffant
      icon: mdi:heating-coil
      features:
      - type: target-temperature
      - type: climate-hvac-modes
        style: icons
      grid_options:
        columns: full
    - type: tile
      entity: binary_sensor.orca_heat_pump_floor_pump_status
      name: Circulateur plancher
      icon: mdi:pump
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.orca_heat_pump_internal_temperature
      name: Eau du circuit
      icon: mdi:thermometer-water
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Eau chaude sanitaire
      icon: mdi:water-boiler
    - type: tile
      entity: water_heater.orca_heat_pump_water_heater
      name: Eau chaude (pendant le programme)
      icon: mdi:water-boiler
      features:
